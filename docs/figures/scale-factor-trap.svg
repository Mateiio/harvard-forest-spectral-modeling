<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" role="img" aria-label="The file says 3000; only the code knows it means 0.30" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The file says 3000; only the code knows it means 0.30</title><rect width="760" height="256" fill="#fcfcfb"/><defs><marker id="scale-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3c2b7"/></marker></defs><text x="24" y="30" fill="#0b0b0b" font-size="15" font-weight="600">The file says 3000. Only the code knows it means 0.30</text><text x="24" y="54" fill="#52514e" font-size="11.5">reflectance is stored as a whole number; the multiplier back to a fraction is missing from the header</text><text x="24" y="126" fill="#0b0b0b" font-weight="600">hard-coded</text><rect x="136" y="98" width="88" height="48" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="180" y="128" fill="#0b0b0b" font-size="17" font-weight="600" text-anchor="middle">3000</text><line x1="224" y1="122" x2="420" y2="122" stroke="#c3c2b7" stroke-width="1.25" marker-end="url(#scale-arrow)"/><text x="322" y="112" fill="#52514e" font-size="11.5" text-anchor="middle">× 0.0001, from the docs</text><rect x="420" y="94" width="316" height="56" fill="#0ca30c" rx="8" fill-opacity="0.12" stroke="#0ca30c" stroke-width="2"/><text x="578" y="120" fill="#0b0b0b" font-size="17" font-weight="600" text-anchor="middle">0.30</text><text x="578" y="140" fill="#0b0b0b" font-size="11.5" text-anchor="middle">the true reflectance</text><text x="24" y="208" fill="#0b0b0b" font-weight="600">from header</text><rect x="136" y="180" width="88" height="48" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="180" y="210" fill="#0b0b0b" font-size="17" font-weight="600" text-anchor="middle">3000</text><line x1="224" y1="204" x2="420" y2="204" stroke="#c3c2b7" stroke-width="1.25" marker-end="url(#scale-arrow)"/><text x="322" y="194" fill="#52514e" font-size="11.5" text-anchor="middle">no multiplier in the header</text><rect x="420" y="176" width="316" height="56" fill="#d03b3b" rx="8" fill-opacity="0.12" stroke="#d03b3b" stroke-width="2"/><text x="578" y="202" fill="#0b0b0b" font-size="17" font-weight="600" text-anchor="middle">3000</text><text x="578" y="222" fill="#0b0b0b" font-size="11.5" text-anchor="middle">10,000× too big, and nothing errors</text></svg>
