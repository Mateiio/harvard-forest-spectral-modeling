<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="Add the sun angle and the spring-autumn gap does not shrink, it flips sign" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Add the sun angle and the spring-autumn gap does not shrink, it flips sign</title><rect width="760" height="296" fill="#fcfcfb"/><text x="24" y="34" fill="#0b0b0b" font-size="15" font-weight="600">Add the sun angle and the spring-autumn gap does not shrink, it flips sign</text><text x="24" y="52" fill="#52514e" font-size="11.5">Spring effect on EVI2 at the same measured leaf area, one shared scale</text><rect x="24" y="68" width="340" height="158" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><line x1="176" y1="126" x2="176" y2="190" stroke="#c3c2b7" stroke-width="1"/><rect x="176" y="141" width="100.8" height="22" fill="#c3c2b7" rx="4" stroke="#c3c2b7" stroke-width="1.25"/><text x="40" y="94" fill="#0b0b0b" font-size="14" font-weight="600">Model without sun angle</text><text x="176" y="118" fill="#52514e" font-size="11.5" text-anchor="middle">no spring effect</text><text x="286.8" y="156" fill="#0b0b0b" font-weight="600">+0.063</text><text x="286.8" y="180" fill="#52514e" font-size="11.5">t = 25.8</text><rect x="392" y="68" width="340" height="158" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><line x1="544" y1="126" x2="544" y2="190" stroke="#c3c2b7" stroke-width="1"/><rect x="504" y="141" width="40" height="22" fill="#2a78d6" rx="4" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><text x="408" y="94" fill="#0b0b0b" font-size="14" font-weight="600">Model with sun angle</text><text x="494" y="156" fill="#0b0b0b" font-weight="600" text-anchor="end">-0.025</text><text x="494" y="180" fill="#52514e" font-size="11.5" text-anchor="end">t = -5.3</text><text x="408" y="210" fill="#52514e" font-size="11.5">sun angle itself: -0.0040 per degree, t = -21.5</text><text x="24" y="250" fill="#52514e" font-size="11.5">Sun angle absorbs the whole gap and then some</text><text x="24" y="268" fill="#52514e" font-size="11.5">It still adds nothing to prediction: sun angle against day of year is R2 0.9927, only 1.2 degrees of scatter</text></svg>
