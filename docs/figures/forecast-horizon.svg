<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img" aria-label="Two months out, a wall calendar is as good as a satellite" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Two months out, a wall calendar is as good as a satellite</title><rect width="760" height="384" fill="#fcfcfb"/><text x="24" y="30" fill="#0b0b0b" font-size="15" font-weight="600">Two months out, a wall calendar is as good as a satellite</text><text x="24" y="52" fill="#52514e" font-size="11.5">R2 gained over a calendar-only forecast</text><rect x="98" y="100" width="100" height="200" fill="#2a78d6" rx="4" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><text x="148" y="90" fill="#0b0b0b" font-weight="600" text-anchor="middle">+0.0489</text><rect x="266" y="241.104" width="100" height="58.896" fill="none" rx="4" stroke="#c3c2b7" stroke-width="1.25"/><text x="316" y="231.104" fill="#0b0b0b" font-weight="600" text-anchor="middle">+0.0144</text><rect x="434" y="257.873" width="100" height="42.127" fill="none" rx="4" stroke="#c3c2b7" stroke-width="1.25"/><text x="484" y="247.873" fill="#0b0b0b" font-weight="600" text-anchor="middle">+0.0103</text><rect x="602" y="296.319" width="100" height="3.681" fill="none" rx="4" stroke="#c3c2b7" stroke-width="1.25"/><text x="652" y="286.319" fill="#0b0b0b" font-weight="600" text-anchor="middle">+0.0009</text><line x1="64" y1="300" x2="736" y2="300" stroke="#c3c2b7" stroke-width="1.25"/><text x="148" y="326" fill="#0b0b0b" font-weight="600" text-anchor="middle">8 days ahead</text><text x="316" y="326" fill="#0b0b0b" text-anchor="middle">16 days ahead</text><text x="484" y="326" fill="#0b0b0b" text-anchor="middle">32 days ahead</text><text x="652" y="326" fill="#0b0b0b" text-anchor="middle">64 days ahead</text><text x="24" y="358" fill="#52514e" font-size="11.5">The forecast still beats both the calendar and simple persistence at every horizon</text></svg>
