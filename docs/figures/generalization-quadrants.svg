<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="The hardest case has never been scored" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The hardest case has never been scored</title><rect width="760" height="392" fill="#fcfcfb"/><defs><marker id="scored-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3c2b7"/></marker></defs><text x="24" y="28" fill="#0b0b0b" font-size="15" font-weight="600">The hardest case has never been scored</text><path d="M96 88H728" fill="none" stroke="#c3c2b7" stroke-width="1.25" marker-end="url(#scored-arrow)"/><path d="M56 100V316" fill="none" stroke="#c3c2b7" stroke-width="1.25" marker-end="url(#scored-arrow)"/><text x="412" y="58" fill="#0b0b0b" font-weight="600" text-anchor="middle">Has the model seen this PLOT before?</text><text x="250" y="78" fill="#52514e" font-size="11.5" text-anchor="middle">yes</text><text x="574" y="78" fill="#52514e" font-size="11.5" text-anchor="middle">no</text><text x="30" y="208" text-anchor="middle" transform="rotate(-90 30 208)" font-weight="600" fill="#0b0b0b">Has the model seen this DATE before?</text><text x="76" y="154" fill="#52514e" font-size="11.5" text-anchor="middle">yes</text><text x="76" y="270" fill="#52514e" font-size="11.5" text-anchor="middle">no</text><rect x="96" y="100" width="308" height="100" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="250" y="134" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="middle">This is the training set</text><text x="250" y="160" fill="#0b0b0b" text-anchor="middle">nothing to score</text><rect x="420" y="100" width="308" height="100" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="574" y="134" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="middle">New plot, known date</text><text x="574" y="160" fill="#0b0b0b" text-anchor="middle">R2 0.863</text><text x="574" y="180" fill="#52514e" font-size="11.5" text-anchor="middle">reported as new plot</text><rect x="96" y="216" width="308" height="100" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="250" y="250" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="middle">Known plot, new date</text><text x="250" y="276" fill="#0b0b0b" text-anchor="middle">R2 0.898</text><text x="250" y="296" fill="#52514e" font-size="11.5" text-anchor="middle">the headline number</text><rect x="420" y="216" width="308" height="100" fill="#2a78d6" rx="8" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 4"/><text x="574" y="250" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="middle">Never scored</text><text x="574" y="276" fill="#0b0b0b" text-anchor="middle">no number exists</text><text x="96" y="344" fill="#52514e" font-size="11.5">The new-plot folds hold out plots, but 100 per cent of their test campaigns also appear in training</text><text x="96" y="364" fill="#52514e" font-size="11.5">86.5 per cent of the variance is between dates, so sharing the date is close to sharing the answer</text></svg>
