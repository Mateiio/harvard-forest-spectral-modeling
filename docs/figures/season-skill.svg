<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="Green-up is easy; at peak summer the indices stop telling leaf apart" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Green-up is easy; at peak summer the indices stop telling leaf apart</title><rect width="760" height="408" fill="#fcfcfb"/><text x="24" y="30" fill="#0b0b0b" font-size="15" font-weight="600">Green-up is easy; at peak summer the indices stop telling leaf apart</text><text x="24" y="56" fill="#52514e" font-size="11.5">R2 within the season</text><rect x="400" y="46" width="12" height="12" fill="#2a78d6" rx="3" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><text x="418" y="56" fill="#0b0b0b" font-size="12">indices + calendar</text><rect x="551" y="46" width="12" height="12" fill="#eb6834" rx="3" fill-opacity="0.12" stroke="#eb6834" stroke-width="2"/><text x="569" y="56" fill="#0b0b0b" font-size="12">with plot identity</text><line x1="28" y1="332" x2="724" y2="332" stroke="#c3c2b7" stroke-width="1.25"/><rect x="56" y="202.624" width="44" height="129.376" fill="#2a78d6" rx="3" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><rect x="108" y="249.294" width="44" height="82.706" fill="#eb6834" rx="3" fill-opacity="0.12" stroke="#eb6834" stroke-width="2"/><text x="78" y="195.624" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.50</text><text x="130" y="242.294" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.32</text><rect x="192" y="114.588" width="44" height="217.412" fill="#2a78d6" rx="3" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><rect x="244" y="103.382" width="44" height="228.618" fill="#eb6834" rx="3" fill-opacity="0.12" stroke="#eb6834" stroke-width="2"/><text x="214" y="107.588" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.84</text><text x="266" y="96.382" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.88</text><rect x="328" y="265.128" width="44" height="66.872" fill="#2a78d6" rx="3" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><rect x="380" y="193.498" width="44" height="138.502" fill="#eb6834" rx="3" fill-opacity="0.12" stroke="#eb6834" stroke-width="2"/><text x="350" y="258.128" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.26</text><text x="402" y="186.498" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.53</text><rect x="464" y="201.896" width="44" height="130.104" fill="#2a78d6" rx="3" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><rect x="516" y="162.792" width="44" height="169.208" fill="#eb6834" rx="3" fill-opacity="0.12" stroke="#eb6834" stroke-width="2"/><text x="486" y="194.896" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.50</text><text x="538" y="155.792" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.65</text><rect x="600" y="242.3" width="44" height="89.7" fill="#2a78d6" rx="3" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><rect x="652" y="239.726" width="44" height="92.274" fill="#eb6834" rx="3" fill-opacity="0.12" stroke="#eb6834" stroke-width="2"/><text x="622" y="235.3" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.34</text><text x="674" y="232.726" fill="#0b0b0b" font-size="11.5" text-anchor="middle">0.35</text><text x="104" y="352" fill="#0b0b0b" text-anchor="middle">winter</text><text x="240" y="352" fill="#0b0b0b" text-anchor="middle">green-up</text><text x="376" y="352" fill="#0b0b0b" text-anchor="middle">peak summer</text><text x="512" y="352" fill="#0b0b0b" text-anchor="middle">senescence</text><text x="648" y="352" fill="#0b0b0b" text-anchor="middle">late autumn</text><text x="24" y="382" fill="#52514e" font-size="11.5">Plot identity hurts in winter: with no leaf there is no stable per-plot offset to learn</text></svg>
