<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" role="img" aria-label="One ground plot is a 684th of a MODIS cell" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>One ground plot is a 684th of a MODIS cell</title><rect width="760" height="412" fill="#fcfcfb"/><text x="24" y="30" fill="#0b0b0b" font-size="15" font-weight="600">One ground plot is a 684th of a MODIS cell</text><rect x="89.988" y="59.988" width="300.024" height="300.024" fill="none" stroke="#c3c2b7" stroke-width="1.25"/><line x1="390.012" y1="100" x2="448" y2="100" stroke="#c3c2b7" stroke-width="1"/><text x="464" y="104" fill="#0b0b0b" font-size="14" font-weight="600">MODIS cell</text><text x="464" y="122" fill="#52514e">463 m square, 214,658 sq m</text><rect x="230.28" y="200.28" width="19.44" height="19.44" fill="none" stroke="#c3c2b7" stroke-width="1.25"/><line x1="249.72" y1="201.28" x2="448" y2="182" stroke="#c3c2b7" stroke-width="1"/><text x="464" y="186" fill="#0b0b0b" font-size="14" font-weight="600">HLS satellite pixel</text><text x="464" y="204" fill="#52514e">30 m square, 900 sq m</text><circle cx="240" cy="210" r="6.48" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><line x1="244.601" y1="214.601" x2="448" y2="262" stroke="#c3c2b7" stroke-width="1"/><text x="464" y="266" fill="#0b0b0b" font-size="14" font-weight="600">Ground plot</text><text x="464" y="284" fill="#52514e">10 m radius, 314 sq m</text><text x="24" y="388" fill="#52514e" font-size="11.5">Triple collocation charges every difference between these footprints to the ground</text></svg>
