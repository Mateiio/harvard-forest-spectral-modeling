<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="The calendar alone reaches 0.72; knowing which plot adds as much as all three indices" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The calendar alone reaches 0.72; knowing which plot adds as much as all three indices</title><rect width="760" height="392" fill="#fcfcfb"/><text x="24" font-size="15" font-weight="600" fill="#0b0b0b"><tspan x="24" y="28">The calendar alone reaches 0.72;</tspan><tspan x="24" y="48">knowing which plot adds as much as all three indices</tspan></text><line x1="292" y1="84" x2="292" y2="340" stroke="#c3c2b7" stroke-width="1.25"/><rect x="292" y="91" width="302.862" height="18" fill="#c3c2b7" rx="4"/><text x="602.862" y="104" fill="#52514e" font-weight="400">0.721</text><text x="24" y="104" fill="#0b0b0b">calendar only</text><rect x="292" y="123" width="345.408" height="18" fill="#c3c2b7" rx="4"/><text x="645.408" y="136" fill="#52514e" font-weight="400">0.822</text><text x="24" y="136" fill="#0b0b0b">EVI2 only</text><rect x="292" y="155" width="334.824" height="18" fill="#c3c2b7" rx="4"/><text x="634.824" y="168" fill="#52514e" font-weight="400">0.797</text><text x="24" y="168" fill="#0b0b0b">NDVI only</text><rect x="292" y="187" width="354.984" height="18" fill="#c3c2b7" rx="4"/><text x="654.984" y="200" fill="#52514e" font-weight="400">0.845</text><text x="24" y="200" fill="#0b0b0b">all three indices</text><rect x="292" y="219" width="362.04" height="18" fill="#c3c2b7" rx="4"/><text x="662.04" y="232" fill="#52514e" font-weight="400">0.862</text><text x="24" y="232" fill="#0b0b0b">indices + calendar</text><rect x="292" y="251" width="323.988" height="18" fill="#c3c2b7" rx="4"/><text x="623.988" y="264" fill="#52514e" font-weight="400">0.771</text><text x="24" y="264" fill="#0b0b0b">plot identity + calendar</text><rect x="292" y="283" width="377.034" height="18" fill="#2a78d6" rx="4" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><text x="677.034" y="296" fill="#0b0b0b" font-weight="600">0.898</text><text x="24" y="296" fill="#0b0b0b" font-weight="600">indices + calendar + plot identity</text><rect x="292" y="315" width="376.782" height="18" fill="#c3c2b7" rx="4"/><text x="676.782" y="328" fill="#52514e" font-weight="400">0.897</text><text x="24" y="328" fill="#0b0b0b">the above, plus sun angle</text><line x1="594.862" y1="80" x2="594.862" y2="340" stroke="#e1e0d9" stroke-width="1.25" stroke-dasharray="4 4"/><text x="586.862" y="74" fill="#52514e" font-size="11.5" text-anchor="end">a wall calendar, no satellite</text><text x="292" y="364" fill="#52514e" font-size="11.5">R2, cross-validated on field campaigns the model never saw</text></svg>
