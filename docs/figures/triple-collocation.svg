<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Nothing is called correct: each error is what one instrument does not share with the other two" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Nothing is called correct: each error is what one instrument does not share with the other two</title><rect width="760" height="440" fill="#fcfcfb"/><text x="24" font-size="15" font-weight="600" fill="#0b0b0b"><tspan x="24" y="28">Nothing is called correct: each error is what</tspan><tspan x="24" y="50">one instrument does not share with the other two</tspan></text><g fill="none" stroke="#c3c2b7" stroke-width="1.25"><line x1="240" y1="160" x2="300" y2="212" stroke="#c3c2b7" stroke-width="1.25"/><line x1="520" y1="160" x2="460" y2="212" stroke="#c3c2b7" stroke-width="1.25"/><line x1="380" y1="280" x2="380" y2="248" stroke="#c3c2b7" stroke-width="1.25"/></g><rect x="56" y="72" width="224" height="88" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="168" y="98" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="middle">Ground crew</text><text x="168" y="120" fill="#52514e" text-anchor="middle">optical PAI, 314 sq m plot</text><text x="168" y="142" fill="#0b0b0b" font-weight="600" text-anchor="middle">29.5% error</text><rect x="480" y="72" width="224" height="88" fill="#2a78d6" rx="8" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><text x="592" y="98" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="middle">HLS satellite</text><text x="592" y="120" fill="#52514e" text-anchor="middle">EVI2, 900 sq m pixel</text><text x="592" y="142" fill="#0b0b0b" font-weight="600" text-anchor="middle">1.3% error</text><rect x="268" y="280" width="224" height="88" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="380" y="306" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="middle">MODIS</text><text x="380" y="328" fill="#52514e" text-anchor="middle">LAI, 214,658 sq m cell</text><text x="380" y="350" fill="#0b0b0b" font-weight="600" text-anchor="middle">28.8% error</text><rect x="300" y="192" width="160" height="56" fill="#c3c2b7" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text text-anchor="middle" fill="#0b0b0b"><tspan x="380" y="214">the shared signal</tspan><tspan x="380" y="232">is the truth</tspan></text><text x="24" y="396" fill="#52514e" font-size="11.5">1,800 three-way matches, 279 independent blocks, 2015 to 2020</text><text x="24" y="414" fill="#52514e" font-size="11.5">Share of each measurement own variance that is its own error</text></svg>
