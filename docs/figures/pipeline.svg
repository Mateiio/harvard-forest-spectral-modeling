<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="Two records are cleaned apart, checked, then joined by date" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Two records are cleaned apart, checked, then joined by date</title><rect width="760" height="280" fill="#fcfcfb"/><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3c2b7"/></marker></defs><text x="24" y="28" fill="#0b0b0b" font-size="15" font-weight="600">Two records are cleaned apart, checked, then joined by date</text><g fill="none" stroke="#c3c2b7" stroke-width="1.25"><path d="M232 100H260V140H288" marker-end="url(#flow-arrow)"/><path d="M232 212H392V192" marker-end="url(#flow-arrow)"/><path d="M488 156H536" marker-end="url(#flow-arrow)"/></g><rect x="24" y="56" width="208" height="88" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="40" y="80" fill="#0b0b0b" font-size="14" font-weight="600">Ground records</text><text x="40" y="96" fill="#0b0b0b">Harvard Forest HF069</text><text x="40" y="112" fill="#0b0b0b">9,922 readings, 46 plots</text><text x="40" y="128" fill="#0b0b0b">1998 to 2025</text><rect x="24" y="168" width="208" height="88" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="40" y="192" fill="#0b0b0b" font-size="14" font-weight="600">Satellite record</text><text x="40" y="208" fill="#0b0b0b">NASA HLS v2.0, rebuilt</text><text x="40" y="224" fill="#0b0b0b">34,291 observations</text><text x="40" y="240" fill="#0b0b0b">1,075 dates, 40 plots</text><rect x="288" y="120" width="200" height="72" fill="none" rx="8" stroke="#c3c2b7" stroke-width="1.25"/><text x="304" y="144" fill="#0b0b0b" font-size="14" font-weight="600">How wrong is each?</text><text x="304" y="160" fill="#0b0b0b">Triple collocation</text><text x="304" y="176" fill="#0b0b0b">1,800 three-way matches</text><rect x="536" y="120" width="192" height="72" fill="#2a78d6" rx="8" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"/><text x="552" y="144" fill="#0b0b0b" font-size="14" font-weight="600">Match and fit</text><text x="552" y="160" fill="#0b0b0b">2,894 paired readings</text><text x="552" y="176" fill="#0b0b0b">ridge regression</text><text x="248" y="228" fill="#52514e" font-size="11.5">error bars written back</text><text x="536" y="216" fill="#52514e" font-size="11.5">R2 0.898 on dates nobody visited</text></svg>
